<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - LA ORBIS GESTIÓN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
</head>
<body>

  <!-- Acceso -->
  <div class="login-fondo" id="loginPantalla">
    <div class="login-tarjeta">
      <span class="escudo" aria-hidden="true"><i class="fa-solid fa-shield"></i><i class="fa-solid fa-key"></i></span>
      <h1>Acceso Admin</h1>
      <form onsubmit="iniciarSesion(event)" novalidate>
        <label for="adminCorreo">Correo Gmail:</label>
        <input type="email" id="adminCorreo" class="form-control campo-login mb-3" required placeholder="ejemplo@gmail.com" autocomplete="email" inputmode="email">
        <label for="adminCarnet">Carnet de identidad:</label>
        <div class="campo-pass">
          <input type="password" id="adminCarnet" class="form-control" required placeholder="Ej: 1234567" autocomplete="off" inputmode="numeric">
          <button type="button" id="verPass" aria-label="Mostrar u ocultar carnet"><i class="fa-regular fa-eye"></i></button>
        </div>
        <div class="form-text text-danger text-start" id="passError" style="display:none;" role="alert"></div>
        <button type="submit" class="btn btn-ciruela" id="btnIngresar">Ingresar</button>
        <a href="index.html" class="volver">Volver al Inicio</a>
      </form>
    </div>
  </div>

  <!-- Contenido del Panel -->
  <div id="adminContent">
    <nav class="admin-barra">
      <div class="container d-flex justify-content-between align-items-center">
        <h1>Panel de Administración - LA ORBIS GESTIÓN</h1>
        <div class="d-flex gap-2">
          <a href="index.html" class="btn btn-terracota btn-sm px-3">Ir al Sitio Web</a>
          <button type="button" class="btn btn-outline-light btn-sm px-3" id="btnSalir"><i class="fa-solid fa-right-from-bracket me-1"></i>Salir</button>
        </div>
      </div>
    </nav>

    <div class="container py-5">
      <h2 class="admin-titulo mb-4">Postulaciones Recibidas</h2>

      <!-- Resumen de Totales -->
      <div class="row g-3 mb-4 kpi-row">
        <div class="col-md-2 col-4"><div class="kpi-card"><small>TOTAL</small><h3 id="kpi-total">0</h3></div></div>
        <div class="col-md-2 col-4"><div class="kpi-card"><small>NUEVOS</small><h3 id="kpi-nuevos">0</h3></div></div>
        <div class="col-md-2 col-4"><div class="kpi-card"><small>PRESELECC.</small><h3 id="kpi-preseleccionados">0</h3></div></div>
        <div class="col-md-2 col-4"><div class="kpi-card"><small>ENTREVISTA</small><h3 id="kpi-entrevistas">0</h3></div></div>
        <div class="col-md-2 col-4"><div class="kpi-card"><small>CONTRATADOS</small><h3 id="kpi-contratados">0</h3></div></div>
        <div class="col-md-2 col-4"><div class="kpi-card"><small>DESCARTADOS</small><h3 id="kpi-descartados">0</h3></div></div>
      </div>

      <!-- Limpieza automática -->
      <div class="panel-filtros mb-4" id="panelLimpieza">
        <div class="d-flex flex-wrap gap-2 align-items-center">
          <div class="small flex-grow-1" id="limpiezaTexto">Cargando configuración de limpieza...</div>
          <button type="button" class="btn btn-outline-dark btn-sm" id="btnDescargarAprobados"><i class="fa-solid fa-download me-1"></i>Descargar aprobados (.json)</button>
          <button type="button" class="btn btn-outline-danger btn-sm" id="btnLimpiarAhora"><i class="fa-regular fa-trash-can me-1"></i>Ejecutar limpieza ahora</button>
        </div>
        <div class="small mt-2" id="limpiezaMsg" style="min-height:1.2em;"></div>
      </div>

      <!-- Filtros -->
      <div class="panel-filtros mb-4">
        <div class="row g-3">
          <div class="col-lg-3 col-md-6">
            <label class="form-label fw-semibold small">Estado:</label>
            <select id="fEstado" class="form-select"></select>
          </div>
          <div class="col-lg-3 col-md-6">
            <label class="form-label fw-semibold small">Formación:</label>
            <select id="fFormacion" class="form-select"></select>
          </div>
          <div class="col-lg-3 col-md-6">
            <label class="form-label fw-semibold small">Años de experiencia (exacto):</label>
            <input type="number" min="0" id="fExp" class="form-control" placeholder="Ej: 3">
          </div>
          <div class="col-lg-3 col-md-6">
            <label class="form-label fw-semibold small">Orden de llegada:</label>
            <select id="fOrden" class="form-select">
              <option value="recientes">Más recientes primero</option>
              <option value="antiguos">Más antiguos primero</option>
            </select>
          </div>

          <div class="col-12">
            <div class="d-flex flex-wrap gap-2 align-items-center">
              <button type="button" class="btn btn-tecnologias btn-sm px-3" id="btnTecnologias">
                <i class="fa-solid fa-code me-1"></i>Lenguajes y tecnologías <span class="badge ms-1" id="badgeTechs" style="display:none;"></span>
              </button>
              <div class="btn-group btn-group-sm" role="group" aria-label="Modo">
                <input type="radio" class="btn-check" name="modo" id="modoAll" value="all" checked>
                <label class="btn btn-outline-secondary" for="modoAll">Cumple todas</label>
                <input type="radio" class="btn-check" name="modo" id="modoAny" value="any">
                <label class="btn btn-outline-secondary" for="modoAny">Cumple alguna</label>
              </div>
              <button type="button" class="btn btn-link btn-sm text-decoration-none ms-auto btn-limpiar" id="btnLimpiar"><i class="fa-solid fa-eraser me-1"></i>Limpiar filtros</button>
            </div>
            <div id="panelTecnologias" class="border rounded-3 p-3 mt-3 bg-light" style="display:none;"></div>
          </div>
        </div>
      </div>

      <div class="text-muted small mb-2" id="contador"></div>

      <!-- Candidatos -->
      <div class="tabla-tarjeta">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0 cand-table">
            <thead><tr><th>Estado</th><th>Nombre</th><th>Puesto</th><th>Experiencia</th><th>Puntos</th><th><span class="visually-hidden">Iniciales</span></th></tr></thead>
            <tbody id="listaPostulaciones"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel lateral con el detalle del candidato -->
  <div id="drawerFondo" class="drawer-fondo"></div>
  <aside id="drawer" class="drawer" aria-hidden="true" role="dialog" aria-label="Detalle del postulante">
    <button type="button" class="drawer-cerrar" id="drawerCerrar" aria-label="Cerrar"><i class="fa-solid fa-xmark"></i></button>
    <div id="drawerContenido"></div>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const ESTADOS = ['Nuevo', 'Preseleccionado', 'Entrevista', 'Contratado', 'Descartado'];
    const SEP = '\u0001';
    let globalData = [];
    let seleccionado = null;               // id del candidato abierto en el panel lateral
    const F = { estado: '', formacion: '', exp: '', orden: 'recientes', modo: 'all', techs: new Set() };

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    const estadoDe = i => i.estado || 'Nuevo';
    const areaDe = i => i.categoria || 'General';
    const puestoDe = i => i.puesto || 'General';

    // ---------- Sesión ----------
    const TOKEN_KEY = 'orbisAdminToken';
    const getToken = () => sessionStorage.getItem(TOKEN_KEY) || '';
    const authFetch = (url, opts = {}) => fetch(url, {
      ...opts,
      headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + getToken() }
    }).then(r => { if (r.status === 401) { cerrarSesion(false); } return r; });

    function mostrarPanel() {
      $('loginPantalla').style.display = 'none';
      $('adminContent').style.display = 'block';
      loadAdminData();
      cargarLimpieza();
    }

    function cerrarSesion(avisar = true) {
      if (avisar) fetch('/api/admin/logout', { method: 'POST', headers: { Authorization: 'Bearer ' + getToken() } }).catch(() => {});
      sessionStorage.removeItem(TOKEN_KEY);
      globalData = [];
      $('adminContent').style.display = 'none';
      $('loginPantalla').style.display = '';
      $('adminCarnet').value = '';
      $('passError').style.display = 'none';
      $('adminCorreo').focus();
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (getToken()) mostrarPanel(); else $('adminCorreo').focus();
      $('btnSalir').addEventListener('click', () => cerrarSesion(true));
      $('verPass').addEventListener('click', () => {
        const campo = $('adminCarnet');
        const oculto = campo.type === 'password';
        campo.type = oculto ? 'text' : 'password';
        $('verPass').firstElementChild.className = oculto ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
      });
    });

    async function iniciarSesion(e) {
      e.preventDefault();
      const err = $('passError');
      const correo = $('adminCorreo').value.trim();
      const carnet = $('adminCarnet').value.trim();
      const mostrar = txt => { err.textContent = txt; err.style.display = 'block'; };

      if (!/^[^\s@]+@gmail\.com$/i.test(correo)) return mostrar('Ingresa un correo de Gmail válido (termina en @gmail.com).');
      if (!/\d{5,}/.test(carnet)) return mostrar('Ingresa tu carnet de identidad.');

      const btn = $('btnIngresar');
      btn.disabled = true; err.style.display = 'none';
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ correo, carnet })
        });
        const json = await res.json();
        if (json.success) {
          sessionStorage.setItem(TOKEN_KEY, json.token);
          mostrarPanel();
        } else {
          mostrar(json.message || 'Correo o carnet incorrecto.');
        }
      } catch (error) {
        mostrar('No se pudo conectar con el servidor.');
      } finally {
        btn.disabled = false;
      }
    }

    async function loadAdminData() {
      try {
        const res = await authFetch('/api/admin/postulaciones');
        const json = await res.json();
        if (json.success) {
          globalData = json.data;
          renderAll();
        }
      } catch (err) {
        console.error('Error al cargar la información:', err);
      }
    }


    // ---------- Limpieza automática ----------
    async function cargarLimpieza() {
      try {
        const r = await authFetch('/api/admin/config-limpieza');
        const c = await r.json();
        if (!c.success) return;
        $('limpiezaTexto').innerHTML = c.activa
          ? `<i class="fa-solid fa-broom me-1"></i>Limpieza automática activa: se borran las postulaciones con más de <b>${c.dias} días</b>. Los estados <b>${esc(c.estados.join(', '))}</b> se guardan antes en <code>aprobados.json</code> (${c.aprobados} guardados).`
          : `Limpieza automática desactivada (config.json). Aprobados guardados: ${c.aprobados}.`;
      } catch (e) { $('limpiezaTexto').textContent = ''; }
    }

    $('btnDescargarAprobados').addEventListener('click', async () => {
      const msg = $('limpiezaMsg');
      try {
        const r = await authFetch('/api/admin/aprobados');
        if (!r.ok) throw new Error();
        const url = URL.createObjectURL(await r.blob());
        const a = Object.assign(document.createElement('a'), { href: url, download: 'aprobados.json' });
        document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      } catch (e) { msg.className = 'small mt-2 text-danger'; msg.textContent = 'No se pudo descargar el archivo.'; }
    });

    $('btnLimpiarAhora').addEventListener('click', async () => {
      const msg = $('limpiezaMsg');
      if (!confirm('Se borrarán definitivamente las postulaciones que superen el tiempo de retención (los aprobados se guardan en aprobados.json). ¿Continuar?')) return;
      msg.className = 'small mt-2 text-muted'; msg.textContent = 'Limpiando...';
      try {
        const r = await authFetch('/api/admin/limpiar-ahora', { method: 'POST' });
        const j = await r.json();
        if (!j.success) throw new Error();
        msg.className = 'small mt-2 text-success';
        msg.textContent = `Listo: ${j.borrados} postulaciones borradas, ${j.archivados} aprobadas guardadas.`;
        loadAdminData(); cargarLimpieza();
      } catch (e) { msg.className = 'small mt-2 text-danger'; msg.textContent = 'No se pudo ejecutar la limpieza.'; }
    });

    // ---------- Lectura de respuestas ----------
    // "Pregunta: resp | Pregunta: a; b; c" -> [[Pregunta, [resp]], [Pregunta, [a,b,c]]]
    function respuestas(item) {
      if (item._r) return item._r;
      const out = [];
      (item.detalle_especifico || '').split(' | ').forEach(par => {
        const k = par.indexOf(': ');
        if (k > 0) out.push([par.slice(0, k).trim(), par.slice(k + 2).split('; ').map(v => v.trim()).filter(Boolean)]);
      });
      Object.defineProperty(item, '_r', { value: out, enumerable: false });
      return out;
    }
    // Valores "filtrables" (tecnologías / opciones). Se excluye texto libre largo, enlaces y "Ninguno".
    const esTech = v => v.length <= 40 && !/https?:\/\//i.test(v) && v !== 'Ninguno';
    const esOtro = v => !esTech(v) && v !== 'Ninguno';   // texto libre (respuestas antiguas)
    // Lista general de tecnologías de una postulación, sin importar la sección donde se marcaron
    const techsDe = item => [...new Set(respuestas(item).flatMap(([l, vs]) => vs.filter(esTech)))];
    const puntos = item => techsDe(item).length;

    // ---------- Filtrado ----------
    function enAlcance(i) { return true; } // sin filtro de área/puesto

    function filtrar() {
        const res = globalData.filter(i => {
        if (!enAlcance(i)) return false;
        if (F.estado && estadoDe(i) !== F.estado) return false;
        if (F.formacion && (i.formacion || '') !== F.formacion) return false;
        if (F.exp !== '' && (parseInt(i.experiencia) || 0) !== parseInt(F.exp)) return false;
        if (F.techs.size) {
          const mias = new Set(techsDe(i));
          const sel = [...F.techs];
          const ok = F.modo === 'all' ? sel.every(k => mias.has(k)) : sel.some(k => mias.has(k));
          if (!ok) return false;
        }
        return true;
      });
      res.sort((a, b) => {
        if (F.orden === 'antiguos') return new Date(a.fecha) - new Date(b.fecha);
        return new Date(b.fecha) - new Date(a.fecha);
      });
      return res;
    }

    // ---------- Controles de filtro ----------
    function fillSelect(sel, todosTxt, pares, valorActual) {
      sel.innerHTML = '';
      sel.add(new Option(todosTxt, ''));
      pares.forEach(([v, t]) => sel.add(new Option(t, v)));
      sel.value = pares.some(([v]) => v === valorActual) ? valorActual : '';
      return sel.value;
    }
    const contar = (arr, fn) => arr.reduce((m, i) => { const k = fn(i); m[k] = (m[k] || 0) + 1; return m; }, {});

    function renderControles() {
      const estados = contar(globalData, estadoDe);
      F.estado = fillSelect($('fEstado'), 'Todos los estados', ESTADOS.map(e => [e, `${e} (${estados[e] || 0})`]), F.estado);

      const forms = [...new Set(globalData.map(i => i.formacion).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
      F.formacion = fillSelect($('fFormacion'), 'Cualquier formación', forms.map(f => [f, f]), F.formacion);
    }

    function renderChips() {
      const conteo = new Map(); // tecnología -> cantidad de postulantes
      globalData.forEach(i => techsDe(i).forEach(v => conteo.set(v, (conteo.get(v) || 0) + 1)));
      [...F.techs].forEach(v => { if (!conteo.has(v)) F.techs.delete(v); });

      const panel = $('panelTecnologias');
      panel.innerHTML = conteo.size
        ? `<div class="d-flex flex-wrap gap-1">${[...conteo.entries()]
            .sort((x, y) => x[0].localeCompare(y[0], 'es', { sensitivity: 'base' }))
            .map(([v, n]) => `<button type="button" class="btn btn-sm chip ${F.techs.has(v) ? 'btn-primary' : 'btn-outline-secondary'}" data-chip="${esc(v)}">${esc(v)} <span class="opacity-75">${n}</span></button>`)
            .join('')}</div>`
        : '<span class="text-muted small">Aún no hay postulaciones con lenguajes o tecnologías.</span>';

      const b = $('badgeTechs');
      b.textContent = F.techs.size;
      b.style.display = F.techs.size ? '' : 'none';
    }

    // ---------- Tarjetas ----------
    function fechaCorta(f) {
      const d = new Date(f);
      if (isNaN(d)) return '';
      return d.toLocaleDateString('es-BO', { day: 'numeric', month: 'short', year: 'numeric' }).replace(/\./g, '');
    }

    const PASTELES = ['#fca59b', '#a5d8f3', '#9fe3d6', '#a7e3bf', '#fde9a2', '#a9c4ec', '#d3b5f0', '#f7b8d4'];
    const colorDe = t => PASTELES[[...t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % PASTELES.length];
    const iniciales = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
    const expTxt = i => { const n = parseInt(i.experiencia); return (i.experiencia === undefined || i.experiencia === '' || isNaN(n)) ? '-' : `${n} ${n === 1 ? 'año' : 'años'}`; };

    const AVATARES = ['#2b1230', '#c9693f', '#2b7a7b'];
    const avatarDe = t => AVATARES[[...t].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7) % AVATARES.length];

    function fila(i) {
      const e = estadoDe(i);
      return `
      <tr data-id="${i.id}" tabindex="0" class="${i.id === seleccionado ? 'sel' : ''}">
        <td><span class="estado-pill e-${norm(e)}">${esc(e)}</span></td>
        <td class="fw-medium">${esc(i.nombre || 'Sin nombre')}</td>
        <td><span class="rol-pill">${esc(puestoDe(i))}</span></td>
        <td>${esc(expTxt(i))}</td>
        <td><span class="pts">${puntos(i)}</span></td>
        <td class="text-end"><span class="avatar" style="background:${avatarDe(i.nombre || '')}">${esc(iniciales(i.nombre))}</span></td>
      </tr>`;
    }

    function renderLista() {
      const res = filtrar();
      $('contador').textContent = `Mostrando ${res.length} de ${globalData.length} postulaciones`;
      $('listaPostulaciones').innerHTML = res.length
        ? res.map(fila).join('')
        : '<tr><td colspan="6" class="text-center text-muted py-5">No hay postulaciones que coincidan con los filtros.</td></tr>';
    }

    // ---------- Panel lateral ----------
    function abrirDrawer(id) {
      const i = globalData.find(x => x.id === id);
      if (!i) return;
      seleccionado = id;
      const tel = (i.telefono || '').replace(/\D/g, '');
      const wa = `https://wa.me/591${tel}?text=${encodeURIComponent('Hola ' + (i.nombre || '') + ', te contactamos de LA ORBIS GESTIÓN.')}`;
      const techs = techsDe(i);
      const otras = respuestas(i).map(([l, vs]) => [l, vs.filter(esOtro).join('; ')]).filter(([, v]) => v);
      const dato = (icono, label, valor) => `<div class="dato"><span class="ico"><i class="fa-solid ${icono}"></i></span><div><small>${label}:</small><b>${esc(valor || '—')}</b></div></div>`;

      $('drawerContenido').innerHTML = `
        <h2 class="drawer-nombre">${esc(i.nombre || 'Sin nombre')}</h2>
        <div class="text-muted fs-6">${esc(puestoDe(i))}</div>
        <div class="d-flex flex-wrap gap-2 align-items-center my-3">
          <span class="pts-chip">${puntos(i)} pts</span>
          <select id="drawerEstado" class="form-select" style="flex:1; min-width:150px; max-width:340px;">
            ${ESTADOS.map(e => `<option ${estadoDe(i) === e ? 'selected' : ''}>${e}</option>`).join('')}
          </select>
          <a href="${wa}" target="_blank" rel="noopener" class="btn btn-success fw-semibold"><i class="fa-brands fa-whatsapp me-1"></i>WhatsApp</a>
        </div>

        <section class="drawer-card">
          <h6>Datos Personales</h6>
          <div class="datos-grid">
            ${dato('fa-phone', 'Teléfono / WhatsApp', i.telefono)}
            ${dato('fa-id-card', 'Carnet de identidad', i.carnet)}
            ${dato('fa-graduation-cap', 'Formación', i.formacion)}
            ${dato('fa-briefcase', 'Experiencia', expTxt(i) === '-' ? '' : expTxt(i))}
            ${dato('fa-calendar', 'Postulado', fechaCorta(i.fecha))}
          </div>
        </section>

        <section class="drawer-card">
          <h6>Perfil Técnico</h6>
          ${techs.length
            ? techs.map(t => `<span class="tag" style="background:${colorDe(t)}">${esc(t)}</span>`).join('')
            : '<span class="text-muted small">No marcó lenguajes ni tecnologías.</span>'}
          ${otras.map(([l, v]) => `<div class="small mt-2"><span class="text-muted">${esc(l)}:</span> ${esc(v)}</div>`).join('')}
        </section>

        <section class="drawer-card">
          <h6>Notas tuyas (entrevista, impresiones...)</h6>
          <textarea id="drawerNotas" class="form-control mb-2" rows="4" placeholder="Notas tuyas (entrevista, impresiones...)">${esc(i.notas || '')}</textarea>
          <button type="button" class="btn btn-outline-dark w-100" id="drawerGuardar">Guardar nota</button>
          <div class="small text-success mt-2" id="drawerMsg" style="min-height:1.2em;"></div>
        </section>

        <section class="drawer-card zona-borrar">
          <h6>Eliminar postulante</h6>
          <button type="button" class="btn btn-outline-danger w-100" id="drawerBorrar"><i class="fa-regular fa-trash-can me-1"></i>Eliminar postulante</button>
          <div id="drawerConfirmar" style="display:none;">
            <p class="small mb-2">¿Eliminar a <b>${esc(i.nombre || 'este postulante')}</b>? Se borrará definitivamente, con sus notas. No se puede deshacer.</p>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-secondary flex-fill" id="borrarNo">Cancelar</button>
              <button type="button" class="btn btn-danger flex-fill" id="borrarSi">Sí, eliminar</button>
            </div>
          </div>
          <div class="small text-danger mt-2" id="borrarMsg" style="min-height:1.2em;"></div>
        </section>`;

      $('drawer').classList.add('on'); $('drawerFondo').classList.add('on');
      $('drawer').setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      $('drawer').scrollTop = 0;
      renderLista();
    }

    function cerrarDrawer() {
      seleccionado = null;
      $('drawer').classList.remove('on'); $('drawerFondo').classList.remove('on');
      $('drawer').setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      renderLista();
    }

    function updateKPIs(data) {
      $('kpi-total').innerText = data.length;
      $('kpi-nuevos').innerText = data.filter(i => estadoDe(i) === 'Nuevo').length;
      $('kpi-preseleccionados').innerText = data.filter(i => i.estado === 'Preseleccionado').length;
      $('kpi-entrevistas').innerText = data.filter(i => i.estado === 'Entrevista').length;
      $('kpi-contratados').innerText = data.filter(i => i.estado === 'Contratado').length;
      $('kpi-descartados').innerText = data.filter(i => i.estado === 'Descartado').length;
    }

    function renderAll() {
      updateKPIs(globalData);
      renderControles();
      renderChips();
      renderLista();
    }

    // ---------- Guardado ----------
    function guardar(id, cambios) {
      return authFetch('/api/admin/postulaciones/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(cambios)
      }).catch(err => console.error('No se pudo guardar:', err));
    }

    // ---------- Eventos ----------
    function onFiltro() { renderControles(); renderChips(); renderLista(); }

    $('fEstado').addEventListener('change', e => { F.estado = e.target.value; renderLista(); });
    $('fFormacion').addEventListener('change', e => { F.formacion = e.target.value; renderLista(); });
    $('fExp').addEventListener('input', e => { F.exp = e.target.value; renderLista(); });
    $('fOrden').addEventListener('change', e => { F.orden = e.target.value; renderLista(); });
    document.querySelectorAll('input[name="modo"]').forEach(r => r.addEventListener('change', e => { F.modo = e.target.value; renderLista(); }));

    $('btnTecnologias').addEventListener('click', () => {
      const p = $('panelTecnologias');
      p.style.display = p.style.display === 'none' ? '' : 'none';
    });
    $('panelTecnologias').addEventListener('click', e => {
      const btn = e.target.closest('[data-chip]');
      if (!btn) return;
      const k = btn.dataset.chip;
      F.techs.has(k) ? F.techs.delete(k) : F.techs.add(k);
      renderChips(); renderLista();
    });

    $('btnLimpiar').addEventListener('click', () => {
      Object.assign(F, { estado: '', formacion: '', exp: '', orden: 'recientes', modo: 'all' });
      F.techs.clear();
      $('fExp').value = ''; $('fOrden').value = 'recientes'; $('modoAll').checked = true;
      onFiltro();
    });

    // Clic en una fila -> abre el panel lateral
    const lista = $('listaPostulaciones');
    lista.addEventListener('click', e => {
      const tr = e.target.closest('tr[data-id]');
      if (tr) abrirDrawer(parseInt(tr.dataset.id));
    });
    lista.addEventListener('keydown', e => {
      const tr = e.target.closest('tr[data-id]');
      if (tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); abrirDrawer(parseInt(tr.dataset.id)); }
    });

    $('drawerCerrar').addEventListener('click', cerrarDrawer);
    $('drawerFondo').addEventListener('click', cerrarDrawer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && seleccionado !== null) cerrarDrawer(); });

    // Cambiar estado y guardar nota desde el panel
    $('drawerContenido').addEventListener('change', e => {
      if (e.target.id !== 'drawerEstado') return;
      const item = globalData.find(i => i.id === seleccionado);
      if (!item) return;
      item.estado = e.target.value;
      updateKPIs(globalData);
      guardar(item.id, { estado: item.estado });
      renderControles();
      renderLista();
    });
    // Eliminar postulante (con confirmación en dos pasos)
    $('drawerContenido').addEventListener('click', async e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.id === 'drawerBorrar') {
        b.style.display = 'none';
        $('drawerConfirmar').style.display = 'block';
      } else if (b.id === 'borrarNo') {
        $('drawerConfirmar').style.display = 'none';
        $('drawerBorrar').style.display = '';
        $('borrarMsg').textContent = '';
      } else if (b.id === 'borrarSi') {
        const id = seleccionado;
        b.disabled = true;
        try {
          const r = await authFetch('/api/admin/postulaciones/' + id, { method: 'DELETE' });
          if (!r.ok) throw new Error();
          globalData = globalData.filter(x => x.id !== id);
          cerrarDrawer();
          renderAll();
        } catch (err) {
          b.disabled = false;
          $('borrarMsg').textContent = 'No se pudo eliminar. Intenta de nuevo.';
        }
      }
    });

    $('drawerContenido').addEventListener('click', async e => {
      if (e.target.id !== 'drawerGuardar') return;
      const item = globalData.find(i => i.id === seleccionado);
      if (!item) return;
      item.notas = $('drawerNotas').value;
      const msg = $('drawerMsg');
      msg.className = 'small text-muted mt-2'; msg.textContent = 'Guardando...';
      const r = await guardar(item.id, { notas: item.notas });
      if (r && r.ok) { msg.className = 'small text-success mt-2'; msg.textContent = 'Nota guardada ✓'; }
      else { msg.className = 'small text-danger mt-2'; msg.textContent = 'No se pudo guardar la nota.'; }
      setTimeout(() => { if (msg) msg.textContent = ''; }, 2500);
    });
  </script>
</body>
</html>
