<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - LA ORBIS GESTIÓN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="estilos.css" rel="stylesheet">
</head>
<body>

  <header class="nav-crema">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="marca" href="index.html" aria-label="LA ORBIS GESTIÓN, inicio">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="6" fill="#c9693f"/><ellipse cx="20" cy="20" rx="17" ry="8" fill="none" stroke="#2b7a7b" stroke-width="3" transform="rotate(-30 20 20)"/><ellipse cx="20" cy="20" rx="17" ry="8" fill="none" stroke="#2b1230" stroke-width="3" transform="rotate(30 20 20)"/></svg>
        <span>LA ORBIS<br>GESTIÓN</span>
      </a>
      <div class="dropdown">
        <button class="btn-menu dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">Menu</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="index.html">Inicio</a></li>
          <li><a class="dropdown-item" href="index.html#seccion-vacantes">Postulaciones disponibles</a></li>
          <li><a class="dropdown-item" href="admin.html"><i class="fa-solid fa-lock me-1"></i> Admin</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main class="contacto-escena">
    <iframe title="Mapa de La Paz, Bolivia" loading="lazy"
      src="https://www.openstreetmap.org/export/embed.html?bbox=-68.19%2C-16.53%2C-68.08%2C-16.46&amp;layer=mapnik&amp;marker=-16.4955%2C-68.1336"></iframe>
    <div class="titulo-mapa" aria-hidden="true">La Paz</div>

    <div class="bloques sup-der" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>
    <div class="bloques inf-izq" aria-hidden="true"><span class="a"></span><span class="b"></span><span class="c"></span></div>

    <section class="tarjeta-info" aria-label="Datos de contacto">
      <div class="fila"><i class="fa-solid fa-location-dot"></i><div><small>Ubicación:</small><b>La Paz, Bolivia</b></div></div>
      <div class="fila"><i class="fa-solid fa-envelope"></i><div><small>Correo:</small><b>contacto@laorbisgestion.com</b></div></div>
      <div class="fila"><i class="fa-solid fa-phone"></i><div><small>Teléfono:</small><b>+591 (2) 244-0000</b></div></div>
    </section>

    <form class="form-tarjeta" id="formContacto">
      <h1>Escríbenos</h1>
      <div class="row g-2">
        <div class="col-6"><input name="nombre" class="form-control" placeholder="Nombre" aria-label="Nombre" required></div>
        <div class="col-6"><input name="correo" type="email" class="form-control" placeholder="Correo" aria-label="Correo" required></div>
      </div>
      <input name="asunto" class="form-control" placeholder="Asunto" aria-label="Asunto" required>
      <textarea name="mensaje" rows="3" class="form-control" placeholder="Mensaje" aria-label="Mensaje" required></textarea>
      <button type="submit" class="btn btn-terracota" id="btnContacto">Enviar</button>
      <div id="msgContacto" role="status"></div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('formContacto').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnContacto');
      const msg = document.getElementById('msgContacto');
      const datos = Object.fromEntries(new FormData(e.target).entries());
      btn.disabled = true;
      msg.className = 'text-muted'; msg.textContent = 'Enviando...';
      try {
        const res = await fetch('/api/contacto', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        const json = await res.json();
        if (!json.success) throw new Error();
        msg.className = 'text-success'; msg.textContent = 'Mensaje enviado. Te responderemos pronto.';
        e.target.reset();
      } catch (err) {
        msg.className = 'text-danger'; msg.textContent = 'No se pudo enviar. Revisa tu conexión e intenta de nuevo.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
